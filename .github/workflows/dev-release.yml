name: Dev release

# Assembled from the ParkviewLab handbook's dev-release parts, one for each of
# this repository's publish targets that has a dev counterpart: the gate, then
# the dev job of each of those targets. The recipe is in the handbook's ci.md.
#
# A dev build is for local testing: a candidate CI builds before the release, not
# a version for others to use. Manually triggered (workflow_dispatch; run it with
# `--ref develop`, or via `git dev-release`). It creates NO `v*` tag, so the
# release gate is untouched, and runs no changelog job. See the handbook's
# releases.md ("What a release publishes", "Development versioning").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify dev build from develop
        id: v
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "dev-release runs from develop only (got $GITHUB_REF)"; exit 1
          fi
          # The repository's one version file, read as the release gate reads it.
          if [ -f pyproject.toml ]; then
            FILE=pyproject.toml
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          elif [ -f package.json ]; then
            FILE=package.json
            VERSION=$(jq -r .version package.json)
          elif [ -f VERSION.txt ]; then
            FILE=VERSION.txt
            VERSION=$(tr -d '[:space:]' < VERSION.txt)
          else
            echo "no version file: expected pyproject.toml, package.json or VERSION.txt"; exit 1
          fi
          case "$VERSION" in
            *.dev[0-9]*|*-dev[0-9]*) ;;
            *) echo "::error::$FILE version '$VERSION' has no dev marker (expected X.Y.Z.devN or X.Y.Z-devN); the build would be indistinguishable from a release. Open a dev cycle first: git dev-release --open"; exit 1 ;;
          esac
          echo "dev version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  docker:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR push
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (dev tags — NOT latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ needs.gate.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testpypi:
    needs: gate
    runs-on: ubuntu-latest
    environment: testpypi   # matches the trusted-publisher config on TestPyPI
    permissions:
      contents: read
      id-token: write       # TestPyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
